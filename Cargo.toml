[workspace]
members = [
    "hybrid-format",
    "hybrid-format-macros",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/horacehoff/hybrid-format"
readme = "README.md"
categories = ["no-std","value-formatting"]
keywords = ["format", "formatting", "const", "no-std", "string"]

[workspace.dependencies]
hybrid-format-macros = { path = "hybrid-format-macros", version = "=0.2.0" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
implicit_clone = "warn"
str_to_string = "warn"
format_push_string = "warn"
verbose_file_reads = "warn"
mem_forget = "warn"
redundant_clone = "warn"
inline_always = "allow"
missing_inline_in_public_items = "warn"
std_instead_of_core = "warn"
items_after_statements = "allow"
useless_format = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
significant_drop_tightening = "allow"

[profile.bench]
codegen-units=1
opt-level=3
lto = "thin"