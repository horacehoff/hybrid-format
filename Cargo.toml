[workspace]
members = [
    "hybrid-format",
    "hybrid-format-macros",
    "hybrid-format-impls",
]
resolver = "3"

[workspace.package]
rust-version = "1.87.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
implicit_clone = "warn"
str_to_string = "warn"
format_push_string = "warn"
verbose_file_reads = "warn"
mem_forget = "warn"
redundant_clone = "warn"
inline_always = "allow"
missing_inline_in_public_items = "warn"
std_instead_of_core = "warn"

[profile.bench]
codegen-units=1
opt-level=3
lto = "thin"